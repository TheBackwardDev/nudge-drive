# Builds every app and publishes them as a GitHub Release:
#   Android APK, Windows installers (MSI + EXE) and the macOS DMG.
# Push a tag like v1.9.4 (the desktop installers take their version from the tag), or run it from
# the Actions tab with a version number.
#
# Android signing: add these repository secrets to sign the APK with your own key, so users can
# update from one release to the next. Without them the APK is signed with a throwaway debug key.
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.9.4)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/keystore.properties
            echo "Signing with the release key from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
      - name: Build APK
        working-directory: apps
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Name the APK
        run: |
          # The APK is named after the app's own versionName in apps/app/build.gradle.kts.
          V=$(grep -m1 'versionName = ' apps/app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p out
          cp apps/app/build/outputs/apk/release/*.apk "out/NudgeDrive-Android-$V.apk"
          rm -f apps/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        shell: bash
        run: echo "V=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build installers
        # Quoted: PowerShell would otherwise split "-PdesktopVersion=1.0.0" at the first dot.
        working-directory: apps
        run: ./gradlew.bat :desktop:packageReleaseMsi :desktop:packageReleaseExe "-PdesktopVersion=${{ env.V }}" --no-daemon --console=plain
      - name: Name the installers
        shell: bash
        run: |
          mkdir -p out
          cp apps/desktop/build/compose/binaries/main-release/msi/*.msi "out/NudgeDrive-Windows-$V.msi"
          cp apps/desktop/build/compose/binaries/main-release/exe/*.exe "out/NudgeDrive-Windows-$V.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        working-directory: apps
        run: ./gradlew :desktop:packageReleaseDmg "-PdesktopVersion=${VERSION#v}" --no-daemon --console=plain
      - name: Name the DMG
        run: |
          mkdir -p out
          cp apps/desktop/build/compose/binaries/main-release/dmg/*.dmg "out/NudgeDrive-macOS-${VERSION#v}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          ls -l dist
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | Android 8.0+ | \`NudgeDrive-Android-*.apk\` |
          | Windows 10/11 | \`NudgeDrive-Windows-${VERSION#v}.exe\` (or the \`.msi\`) |
          | macOS 12+ (Apple silicon) | \`NudgeDrive-macOS-${VERSION#v}.dmg\` |

          The installers are not code-signed yet. On Windows, choose **More info → Run anyway** if
          SmartScreen warns you. On macOS, right-click the app and choose **Open** the first time.

          The apps connect to https://nudge.qd.je. To use your own server, see the README.
          EOF
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nudge Drive $TAG" --notes-file notes.md
          fi
